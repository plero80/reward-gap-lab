[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reward-gap-lab"
version = "0.1.0"
description = "Experiments with kNN reward-gap correction for PPO training"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
reward-gap = "reward_gap.cli:main"

[project.optional-dependencies]
test = ["pytest>=8"]
research = ["reward-gap-lab[training]", "matplotlib==3.11.2"]
models = ["torch>=2.8,<3", "transformers==5.17.0", "peft==0.20.0"]
training = ["reward-gap-lab[models]", "trl==0.29.1", "accelerate==1.15.0", "datasets==5.0.1", "numpy==2.5.3", "filelock==3.32.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
